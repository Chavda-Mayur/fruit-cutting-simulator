<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Fruit Cutting Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7041267144112275"
     crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #1b1410;
      --fg: #f4eadb;
      --ac: #e5484d;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px system-ui, sans-serif;
      overflow: hidden;
      user-select: none
    }

    [hidden] {
      display: none !important
    }

    canvas {
      display: block;
      touch-action: none
    }

    #hud {
      position: fixed;
      left: 0;
      right: 0;
      top: env(safe-area-inset-top, 0px);
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      pointer-events: none
    }

    #hud>* {
      pointer-events: auto
    }

    button {
      background: #3a2a20;
      color: var(--fg);
      border: 1px solid #6b4a34;
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer
    }

    button.on {
      background: var(--ac);
      border-color: var(--ac)
    }

    button:disabled {
      opacity: .4;
      cursor: default
    }

    .pill {
      background: #0008;
      padding: 6px 12px;
      border-radius: 20px
    }

    #bar {
      flex: 1 1 140px;
      height: 10px;
      background: #0008;
      border-radius: 6px;
      overflow: hidden;
      min-width: 120px
    }

    #bar i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--ac);
      transition: width .2s
    }

    #bot {
      position: fixed;
      left: 0;
      right: 0;
      bottom: env(safe-area-inset-bottom, 0px);
      padding: 10px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap
    }

    #menu,
    #home,
    #set {
      position: fixed;
      inset: 0;
      background: #1b1410f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      overflow: auto
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      max-width: 640px;
      width: 100%
    }

    .card {
      padding: 16px 8px;
      text-align: center;
      border-radius: 12px;
      background: #2b2019;
      border: 1px solid #4d3626
    }

    .card.ok {
      border-color: var(--ac);
      cursor: pointer;
      background: #4a2326
    }

    .card small {
      display: block;
      opacity: .6;
      margin-top: 4px
    }

    #toast {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
      background: #000a;
      padding: 10px 20px;
      border-radius: 12px;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      text-align: center
    }

    svg {
      position: fixed;
      inset: 0;
      pointer-events: none
    }

    html,
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      height: 100dvh
    }

    @media (max-width:700px) {
      #hud {
        padding: 6px;
        gap: 6px;
        font-size: 13px
      }

      #opts,
      #spd {
        flex: 1 1 100%;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px
      }

      #opts button,
      #spd button {
        flex: 0 0 auto;
        padding: 6px 10px;
        font-size: 13px
      }

      #bar {
        order: 5;
        flex: 1 1 100%
      }

      #bot {
        gap: 6px;
        padding: 8px
      }

      #bot button {
        flex: 1 1 28%;
        padding: 12px 6px;
        font-size: 15px
      }

      #grid {
        grid-template-columns: repeat(2, 1fr)
      }

      #toast {
        font-size: 18px;
        width: 80%
      }
    }

    #opts,
    #spd {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px
    }

    .lb {
      font-size: 12px;
      opacity: .7
    }

    #panel {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(176px + env(safe-area-inset-bottom, 0px));
      max-width: 560px;
      margin: 0 auto;
      background: #1b1410f0;
      border: 1px solid #4d3626;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    #bot {
      flex-wrap: nowrap;
      max-width: 560px;
      margin: 0 auto
    }

    #bot button {
      flex: 1 1 0;
      padding: 14px 4px;
      font-size: 15px
    }

    #cut,
    #pause,
    #resume {
      flex: 1.7 1 0 !important
    }

    #cut:disabled,
    #pause:disabled,
    #resume:disabled {
      display: none
    }

    #cutrow {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(78px + env(safe-area-inset-bottom, 0px));
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px
    }

    #cutrow #opts {
      flex: 1;
      justify-content: center
    }

    #cutrow button {
      flex: 0 0 auto !important;
      padding: 8px 13px;
      font-size: 14px
    }

    #spdrow {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(124px + env(safe-area-inset-bottom, 0px));
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px
    }

    #spdrow #spd {
      flex: 1;
      justify-content: center
    }

    #spdrow button {
      flex: 0 0 auto !important;
      padding: 8px 10px;
      font-size: 14px
    }

    #cutrow .lb,
    #spdrow .lb {
      width: 44px
    }
  </style>
</head>

<body>
  <svg id="trail" width="100%" height="100%">
    <line id="ln" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0" />
  </svg>
  <div id="hud" hidden>
    <span class="pill" id="fn"></span><span class="pill">Cuts <b id="cn">0</b>/<b id="ct">1</b></span><span
      class="pill">Score <b id="sc">0</b></span>
    <div id="bar"><i></i></div>
  </div>
  <div id="bot" hidden>
    <div id="cutrow"><span class="lb">Cuts</span>
      <div id="opts"></div>
    </div>
    <div id="spdrow"><span class="lb">Speed</span>
      <div id="spd"></div>
    </div><button id="cut" class="on">Cut</button><button id="pause">Pause</button><button
      id="resume">Resume</button><button id="reset">Reset</button><button id="opt">Options</button><button
      id="next">Fruits</button>
  </div>
  <div id="panel" hidden><button id="snd" class="on">Sound on</button></div>
  <div id="menu" hidden>
    <h1 style="margin:0">Fruit Cutting Simulator</h1>
    <div>Choose a fruit</div>
    <div id="grid"></div><button id="mb">Back</button>
  </div>
  <div id="home">
    <h1 style="margin:0;text-align:center">Fruit Cut<br>Simulator</h1><button id="play" class="on"
      style="width:220px;padding:14px">Play</button><button id="fr" style="width:220px">Fruit selection</button><button
      id="st" style="width:220px">Settings</button>
    <div class="pill">Best <b id="bs">0</b> | Total cuts <b id="tc">0</b></div>
  </div>
  <div id="set" hidden>
    <h2 style="margin:0">Settings</h2><button id="ss">Sound on</button><button id="sv">Vibration on</button><button
      id="cl">Close</button>
  </div>
  <div id="toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./admob.bundle.js"></script>
  <script>
    const $ = id => document.getElementById(id), Z = new THREE.Vector3(0, 0, 1);
    const FRUITS = ['Watermelon', 'Apple', 'Orange', 'Kiwi', 'Mango', 'Pineapple', 'Lemon', 'Dragon Fruit', 'Coconut', 'Strawberry'];

    // ---------- renderer / scene ----------
    const rd = new THREE.WebGLRenderer({ antialias: true }); rd.setPixelRatio(Math.min(devicePixelRatio, 2)); rd.shadowMap.enabled = true; rd.localClippingEnabled = true; rd.outputEncoding = THREE.sRGBEncoding; document.body.prepend(rd.domElement);
    const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, .1, 50);

    const wood = cv(512, 512, (g, w, h) => { for (let y = 0; y < h; y++) { g.fillStyle = `hsl(${28 + 4 * Math.sin(y / 9)},${45 + 8 * Math.sin(y / 23)}%,${42 + 7 * Math.sin(y / 5 + Math.sin(y / 37) * 3)}%)`; g.fillRect(0, y, w, 1) } for (let i = 0; i < 60; i++) { g.strokeStyle = '#5a361855'; g.beginPath(); const y = Math.random() * h; g.moveTo(0, y); g.bezierCurveTo(w / 3, y + 8, w * 2 / 3, y - 8, w, y + 4); g.stroke() } });
    const wall = cv(512, 512, (g, w, h) => { g.fillStyle = '#d9d2c4'; g.fillRect(0, 0, w, h); g.strokeStyle = '#b8b0a0'; g.lineWidth = 3; for (let i = 0; i <= 8; i++) { g.strokeRect(i * 64 - 1, 0, 64, h); g.strokeRect(0, i * 64 - 1, w, 64) } }); wall.wrapS = wall.wrapT = THREE.RepeatWrapping; wall.repeat.set(4, 2);
    const board = new THREE.Mesh(new THREE.BoxGeometry(5, .25, 3.2), new THREE.MeshStandardMaterial({ map: wood, roughness: .7 })); board.position.y = -.125; board.receiveShadow = true; scene.add(board);
    const bk = new THREE.Mesh(new THREE.PlaneGeometry(14, 7), new THREE.MeshStandardMaterial({ map: wall, roughness: .9 })); bk.position.set(0, 2.5, -3); bk.receiveShadow = true; scene.add(bk);
    const cnt = new THREE.Mesh(new THREE.BoxGeometry(14, .2, 8), new THREE.MeshStandardMaterial({ color: 0x6e6a66, roughness: .5 })); cnt.position.set(0, -.35, 0); scene.add(cnt);
    scene.add(new THREE.HemisphereLight(0xfff4e0, 0x554433, .7));
    const sun = new THREE.DirectionalLight(0xfff0d8, .95); sun.position.set(2.5, 5, 3); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); scene.add(sun);
    // ---------- fruit textures ----------
    const shellTex = cv(512, 256, (g, w, h) => { for (let x = 0; x < w; x++) { g.fillStyle = `hsl(118,${42 + 20 * Math.sin(x / 7)}%,${20 + 11 * Math.sin(x / (w / 30) * 6.28 + Math.sin(x / 11))}%)`; g.fillRect(x, 0, 1, h) } for (let i = 0; i < 500; i++) { g.fillStyle = '#ffffff08'; g.fillRect(Math.random() * w, Math.random() * h, 3, 3) } });
    const FC = {}; function face(r) { const k = F.i + '_' + Math.round(r * 20) + '_' + (Math.random() * 3 | 0); return FC[k] || (FC[k] = cv(256, 256, (g, w) => paint(g, w, r))) }
    function face0(r) {
      return cv(256, 256, (g, w) => {
        const c = w / 2, rd = .1 / r, k = c - 1; let gr = g.createRadialGradient(c, c, 0, c, c, k); const a = 1 - rd * 2.2, b = 1 - rd * 1.2, e = 1 - rd * .5;
        gr.addColorStop(0, '#ff5a66'); gr.addColorStop(Math.max(.2, a - .2), '#f03a4e'); gr.addColorStop(a, '#f9a0a6'); gr.addColorStop(b, '#f2f0d0'); gr.addColorStop(e, '#9ccf6a'); gr.addColorStop(1, '#2d7a35'); g.fillStyle = '#2d7a35'; g.fillRect(0, 0, w, w); g.fillStyle = gr; g.beginPath(); g.arc(c, c, k, 0, 7); g.fill();
        for (let i = 0; i < 26; i++) { const an = Math.random() * 6.28, d = Math.random() * (a - .1) * k; g.save(); g.translate(c + Math.cos(an) * d, c + Math.sin(an) * d); g.rotate(Math.random() * 6.28); g.fillStyle = '#1a1210'; g.beginPath(); g.ellipse(0, 0, 3, 6, 0, 0, 7); g.fill(); g.restore() }
        for (let i = 0; i < 800; i++) { g.fillStyle = '#ffffff10'; g.fillRect(Math.random() * w, Math.random() * w, 2, 2) }
      })
    }
    // ---------- fruit model (convex pieces of a unit sphere, 600 volume sample points) ----------
    const root = new THREE.Group(); root.scale.set(.85, .72, 1.05); root.position.y = .72; scene.add(root);
    const sph = new THREE.SphereGeometry(1, 64, 48), PTS = []; while (PTS.length < 1500) { const v = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1); if (v.lengthSq() <= 1) PTS.push(v) }
    let pieces = [], hist = [], cuts = 0, target = 1, score = 0, roundFinished = false;
    function mk(cons, pts, pos) {
      const g = new THREE.Group(); g.position.copy(pos); const planes = cons.map(() => new THREE.Plane());
      const sh = new THREE.Mesh(sph, new THREE.MeshStandardMaterial({ map: F.tex, roughness: .4, clippingPlanes: planes, clipShadows: true })); sh.castShadow = true; g.add(sh);
      cons.forEach((c, k) => {
        if (Math.abs(c.d) >= .98) return; const r = Math.sqrt(1 - c.d * c.d), m = new THREE.Mesh(new THREE.CircleGeometry(1, 32), new THREE.MeshStandardMaterial({ map: face(r), roughness: .45, side: THREE.DoubleSide, clippingPlanes: planes.filter((_, j) => j !== k), clipShadows: true }));
        m.scale.setScalar(r); m.position.copy(c.n).multiplyScalar(c.d); m.quaternion.setFromUnitVectors(Z, c.n); m.castShadow = true; g.add(m)
      });
      root.add(g); return { g, cons, pts, pos: g.position, vel: new THREE.Vector3(), planes, minY: Math.min(...pts.map(p => p.y)), c: pts.reduce((s, v) => s.add(v), new THREE.Vector3()).divideScalar(pts.length), ctr: new THREE.Vector3(), rr: Math.cbrt(pts.length / PTS.length) * .75 + .05 }
    }
    function build(data) { pieces.forEach(p => root.remove(p.g)); pieces = data.map(d => mk(d.cons, d.pts, d.pos)) }
    const snap = () => pieces.map(p => ({ cons: p.cons, pts: p.pts, pos: p.pos.clone() }));
    function resetFruit() {
      roundFinished = false;
      au.run = au.pause = false;
      knife.visible = false;
      hist = [];
      cuts = 0;
      score = 0;
      build([{ cons: [], pts: PTS, pos: new THREE.Vector3() }]);
      ui();
    }// ---------- cutting ----------

    function doCut(a, b) {
      if (roundFinished || au.run) return;

      const ray = p => new THREE.Vector3(
        p.x / innerWidth * 2 - 1,
        -p.y / innerHeight * 2 + 1,
        .5
      ).unproject(cam).sub(cam.position).normalize();

      const N = new THREE.Vector3().crossVectors(ray(a), ray(b)).normalize();
      const pl = new THREE.Plane().setFromNormalAndCoplanarPoint(N, cam.position);

      root.updateMatrixWorld(true);
      pl.applyMatrix4(new THREE.Matrix4().copy(root.matrixWorld).invert());

      const n = pl.normal.clone(), d = -pl.constant, before = snap(), out = [];
      let split = false;

      for (const p of pieces) {
        const dd = d - n.dot(p.pos), A = [], B = [];

        for (const v of p.pts) {
          (n.dot(v) - dd >= 0 ? A : B).push(v);
        }

        if (A.length < 8 || B.length < 8) {
          out.push({
            cons: p.cons,
            pts: p.pts,
            pos: p.pos.clone(),
            vel: p.vel.clone()
          });
          continue;
        }

        split = true;

        const mkp = (s, pts) => ({
          cons: [...p.cons, { n, d: dd, s }],
          pts,
          pos: p.pos.clone(),
          vel: p.vel.clone()
            .addScaledVector(n, s * .9)
            .add(new THREE.Vector3(0, .5, 0))
        });

        out.push(mkp(1, A), mkp(-1, B));
      }

      if (!split) {
        toast('Missed: swipe across the fruit');
        return;
      }

      hist.push(before);
      build(out);

      pieces.forEach((p, i) => p.vel.copy(out[i].vel));

      cuts++;
      score += 100;

      sfx();
      juice(N, pl);
      ui();

      if (cuts >= target) finish();
    }
    function toast(t) { const e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(e.t); e.t = setTimeout(() => e.style.opacity = 0, 1400) }
    function ui() { $('cn').textContent = cuts; $('ct').textContent = target; $('sc').textContent = score; $('bar').firstChild.style.width = Math.min(100, cuts / target * 100) + '%';[...$('opts').children].forEach(b => b.classList.toggle('on', +b.dataset.n === target));[...$('spd').children].forEach((b, i) => b.classList.toggle('on', i === spd)); $('cut').disabled = au.run; $('pause').disabled = !au.run || au.pause; $('resume').disabled = !au.pause }
    [1, 4, 8, 16, 32, 64].forEach(n => { const b = document.createElement('button'); b.textContent = n; b.dataset.n = n; b.onclick = () => { target = n; resetFruit() }; $('opts').appendChild(b) });
    const au = { run: false, pause: false, ph: 'wait', t: 0, cut: false, plan: null, fin: 0 };
    function plan() { const order = [...pieces].sort((a, b) => b.pts.length - a.pts.length); for (const P of order) { if (P.pts.length < 10) break; for (let i = 0; i < 14; i++) { const th = cuts * 2.4 + .4 + i * .22, n = new THREE.Vector3(Math.cos(th), 0, Math.sin(th)), dd = n.dot(P.c); let A = 0; for (const v of P.pts) if (n.dot(v) - dd >= 0) A++; if (A >= 4 && P.pts.length - A >= 4) return { P, n, dd } } } return null }
    function aim(pl) { const w = root.localToWorld(pl.P.c.clone().add(pl.P.pos)), tx = -pl.n.z * root.scale.x, tz = pl.n.x * root.scale.z; knife.position.set(w.x, 2.6, w.z); knife.rotation.set(0, Math.atan2(-tz, tx), 0); knife.visible = true }
    function doAuto() {
      const { P, n, dd } = au.plan, w = root.localToWorld(P.c.clone().add(P.pos)), s = [1, -1].map(sg => mk([...P.cons, { n, d: dd, s: sg }], P.pts.filter(v => (n.dot(v) - dd >= 0) === (sg > 0)), P.pos.clone()));
      s.forEach((q, i) => q.vel.copy(P.vel).addScaledVector(n, (i ? -1 : 1) * .5).add(new THREE.Vector3(0, .4, 0)));
      root.remove(P.g); P.g.traverse(o => { if (o.isMesh) { if (o.geometry !== sph) o.geometry.dispose(); o.material.dispose() } });
      pieces.splice(pieces.indexOf(P), 1, ...s); cuts++; score += 100; sfx(); if (SV.vib !== false && navigator.vibrate) navigator.vibrate(12); juice(new THREE.Vector3(n.x / root.scale.x, 0, n.z / root.scale.z).normalize(), 0, w); ui()
    }
    function finish() {

      // Prevent duplicate completion and multiple ads
      if (roundFinished) return;
      roundFinished = true;

      au.run = false;
      au.fin = 1;

      SV.best = Math.max(SV.best || 0, score);
      SV.total = (SV.total || 0) + cuts;

      save();
      refreshHome();

      toast('Complete! ' + cuts + ' cuts, ' + score + ' points');

      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          const P = pieces[Math.random() * pieces.length | 0];

          if (P) juice(
            new THREE.Vector3(Math.random() - .5, 0, Math.random() - .5).normalize(),

    } function stepAuto(dt) {
      if (!au.run || au.pause) return; au.t += dt * SPF[spd];
      if (au.ph === 'wait') { if (au.t > .5) { au.plan = plan(); if (!au.plan) { finish(); return } aim(au.plan); au.ph = 'down'; au.t = 0; au.cut = false } }
      else if (au.ph === 'down') { const u = Math.min(1, au.t / .55), e = u * u * (3 - 2 * u); knife.position.y = 2.6 - 2.13 * e; if (u >= .6 && !au.cut) { au.cut = true; doAuto() } if (u >= 1) { au.ph = 'up'; au.t = 0 } }
      else { const u = Math.min(1, au.t / .4); knife.position.y = .47 + 2.1 * u * u; if (u >= 1) { knife.visible = false; if (cuts >= target) finish(); else { au.ph = 'wait'; au.t = 0 } } }
    }
    let F = null, spd = 0; const SPF = [1, 2.5, 5, 10], SV = (() => { try { return JSON.parse(localStorage.getItem('fcs') || '{}') } catch (e) { return {} } })();
    function save() { try { localStorage.setItem('fcs', JSON.stringify(SV)) } catch (e) { } }
    function refreshHome() { $('bs').textContent = SV.best || 0; $('tc').textContent = SV.total || 0 }
    const FR = [
      { n: 'Watermelon', sc: [.85, .72, 1.05], rind: .1, ring: ['#2d7a35', '#f2f0d0', '#f9a0a6', '#f03a4e', '#ff5a66'], seed: { n: 26, c: '#1a1210', s: 6, r: [0, .95] }, juice: 0xff3a55, t: ['#5aa63c', '#173f1d', 'stripe'] },
